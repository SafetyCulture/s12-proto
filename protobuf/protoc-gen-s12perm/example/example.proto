syntax = "proto3";
package example;

import "s12/flags/permissions/permissions.proto";


option go_package = "github.com/SafetyCulture/s12-proto/protobuf/protoc-gen-s12perm/example";

service Example {
    rpc Unary(Request) returns (Response) {
        option (s12.flags.permissions.required_flags) = "write:users";
    }
    rpc ServerStream(Request) returns (stream Response) {
        option (s12.flags.permissions.required_flags) = "write:users";
    }
}

service NoPermissions {
    rpc Unary(Request) returns (Response) {}
}

service ExampleWithScopes {
    rpc Unary(Request) returns (Response) {
        option (s12.flags.permissions.required_scope) = "admin";
    }

    rpc ServerStream(Request) returns (stream Response) {
        option (s12.flags.permissions.required_flags) = "write:users";
        option (s12.flags.permissions.required_scope) = "user";
    }
}

service ExampleWithAnyOfPermissions {
    rpc Unary(Request) returns (Response) {
        option (s12.flags.permissions.required_permissions) = {any_of: ["write:users", "write:folders"]};
    }

    rpc ServerStream(Request) returns (stream Response) {
        option (s12.flags.permissions.required_permissions) = {any_of: ["write:users", "write:folders"]};
    }
}

service ExampleWithMixedPermissions {
    rpc Unary(Request) returns (Response) {
        option (s12.flags.permissions.required_permissions) = {all_of: ["read:users", "read:sensors"]};
        option (s12.flags.permissions.required_permissions) = {any_of: ["write:folders", "write:assets"]};
    }
}

service ExampleWithTwoAnyOfPermissions {
    rpc Unary(Request) returns (Response) {
        option (s12.flags.permissions.required_permissions) = {any_of: ["write:users", "write:folders"]};
        option (s12.flags.permissions.required_permissions) = {any_of: ["write:sensors", "write:assets"]};
    }
}

service ExampleWithFlagsAndPermissions {
    rpc Unary(Request) returns (Response) {
        option (s12.flags.permissions.required_flags) = "read:users";
        option (s12.flags.permissions.required_permissions) = {any_of: ["write:folders", "write:assets"]};
    }
}

message Request {}

message Response {}
