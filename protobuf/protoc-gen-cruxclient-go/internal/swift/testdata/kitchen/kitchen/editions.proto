edition = "2023";

package kitchen.editions;

message Ed {
  int32 implicit = 1 [features.field_presence = IMPLICIT];
  int32 explicit = 2 [features.field_presence = EXPLICIT];
  int32 required = 3 [features.field_presence = LEGACY_REQUIRED];
  repeated int32 packed = 4;
  repeated int32 expanded = 5 [features.repeated_field_encoding = EXPANDED];
  Delim delimited = 6 [features.message_encoding = DELIMITED];
  Mode mode = 7;
  Open open = 8;
  oneof pick {
    string a = 9;
    int32 b = 11;
    int64 c = 12;
  }
  string non_validated = 10 [features.utf8_validation = NONE];

  message Delim {
    int32 inner = 1;
  }
}

enum Mode {
  option features.enum_type = CLOSED;
  MODE_ONE = 0;
  MODE_TWO = 1;
}

enum Open {
  OPEN_ONE = 0;
  OPEN_TWO = 1;
}
