[tools]
go = "1.26"
buf = "1.68.4"
golangci-lint = "2.11.4"
protoc = "36.1"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"

# The s12perm example module is deliberately absent from the loops below: it
# imports private sc-go.io modules that a CI runner cannot fetch. Its generated
# fixture is still checked by verify:generated, which is what catches template
# drift.

[tasks.build]
description = "Build all packages (root module and the plugin modules)"
run = """
set -eu
go build ./...
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && go build ./...)
done
"""

[tasks.vet]
description = "Run go vet (root module and the plugin modules)"
run = """
set -eu
go vet ./...
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && go vet ./...)
done
"""

[tasks.generate]
description = "Generate Go code from proto definitions"
run = "make generate"

[tasks.test]
description = "Run tests (root module and the plugin modules)"
run = """
set -eu
go test ./...
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && go test ./...)
done
"""

[tasks."verify:generated"]
description = "Fail if the checked-in generated fixtures do not match a fresh generation"
# The tests exercise generated code that is committed, so a template change in
# plugin.go passes CI while the tests run against the old output. Regenerating
# and failing on a difference is the only thing tying the two together.
#
# protoc is pinned in [tools] because the version is written into the generated
# header, so an unpinned one reports a difference that is not a real one.
run = """
set -eu
bin="$(mktemp -d)"
validator_pathspec=':(glob)protobuf/protoc-gen-govalidator/*/*.validator*.pb.go'
s12perm_pathspec=':(glob)protobuf/protoc-gen-s12perm/example/*.perm.pb.go'
# Generating overwrites the fixtures, so refuse to start over an uncommitted change
# rather than discard it on a run that would otherwise report success.
if [ -n "$(git status --porcelain --untracked-files=all -- "$validator_pathspec" "$s12perm_pathspec")" ]; then
  echo "The generated fixtures have uncommitted changes."
  echo "Commit or discard them, then run 'mise run verify:generated' again."
  exit 1
fi
# Nothing uncommitted is left to lose, so a run that dies mid-generation can put
# the deleted fixtures back from git.
regenerated=0
restore() {
  if [ "$regenerated" = 0 ]; then
    git checkout -- "$validator_pathspec" "$s12perm_pathspec" 2>/dev/null || true
  fi
  return 0
}
trap restore EXIT
go build -o "$bin/protoc-gen-govalidator" ./protobuf/protoc-gen-govalidator
find protobuf/protoc-gen-govalidator -mindepth 2 -maxdepth 2 -name '*.validator*.pb.go' -delete
for d in valtest example; do
  protoc \
    -I"./protobuf/protoc-gen-govalidator/$d" -I. \
    --plugin=protoc-gen-govalidator="$bin/protoc-gen-govalidator" \
    --govalidator_out=paths=source_relative:"protobuf/protoc-gen-govalidator/$d" \
    "protobuf/protoc-gen-govalidator/$d"/*.proto
done
go build -o "$bin/protoc-gen-s12perm" ./protobuf/protoc-gen-s12perm
find protobuf/protoc-gen-s12perm/example -maxdepth 1 -name '*.perm.pb.go' -delete
protoc \
  -I"./protobuf/protoc-gen-s12perm/example" -I. \
  --plugin=protoc-gen-s12perm="$bin/protoc-gen-s12perm" \
  --s12perm_out=paths=source_relative:"protobuf/protoc-gen-s12perm/example" \
  protobuf/protoc-gen-s12perm/example/*.proto
regenerated=1  # a mismatch past here is the finding, so leave it on disk
# Stale outputs are cleared above, so a fixture the generator no longer emits
# shows up as deleted; git status (not diff) catches one never added.
dirty="$(git status --porcelain --untracked-files=all -- "$validator_pathspec" "$s12perm_pathspec")"
if [ -n "$dirty" ]; then
  echo "$dirty"
  git --no-pager diff -- "$validator_pathspec" "$s12perm_pathspec" || true
  echo ""
  echo "The generated files are out of date or not committed. Run"
  echo "'mise run verify:generated' and commit the result."
  exit 1
fi
"""

[tasks.lint]
description = "Run Go linter (root module and the plugin modules)"
run = """
set -u
status=0
golangci-lint run || status=1
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && golangci-lint run) || status=1
done
exit "$status"
"""

[tasks."fmt:proto"]
description = "Format proto files with buf"
run = "buf format -w"

[tasks."lint:proto"]
description = "Lint proto files with buf"
run = "buf lint"

[tasks."breaking:proto"]
description = "Check for breaking proto changes against base branch"
run = 'buf breaking s12 --against ".git#branch=origin/${GITHUB_BASE_REF},subdir=s12"'
