[tools]
go = "1.26"
buf = "1.68.4"
golangci-lint = "2.11.4"
protoc = "36.1"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"

[tasks.build]
description = "Build all packages (root module and the plugin modules)"
run = """
set -eu
go build ./...
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && go build ./...)
done
"""

[tasks.vet]
description = "Run go vet (root module and the plugin modules)"
run = """
set -eu
go vet ./...
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && go vet ./...)
done
"""

[tasks.generate]
description = "Regenerate the protoc-gen-go output under s12/ (fixtures: update:generated)"
run = "make generate"

[tasks.test]
description = "Run tests (root module and the plugin modules)"
run = """
set -eu
go test ./...
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && go test ./...)
done
"""

[tasks."verify:generated"]
description = "Fail if the committed fixtures differ from a fresh generation; writes nothing"
# Tests run against generated code that is committed, so a template change passes
# CI while the tests exercise the old output. Regenerating and diffing is what
# ties the two together. The fixtures covered, and the generators deliberately
# not covered, are declared at the top of scripts/generated-fixtures.sh.
run = "./scripts/generated-fixtures.sh verify"

[tasks."update:generated"]
description = "Rewrite the committed fixtures from a fresh generation, then commit them"
run = "./scripts/generated-fixtures.sh update"

[tasks.lint]
description = "Run Go linter (root module and the plugin modules)"
run = """
set -u
status=0
golangci-lint run || status=1
for d in protobuf/protoc-gen-cruxclient-go; do
  (cd "$d" && golangci-lint run) || status=1
done
exit "$status"
"""

[tasks."fmt:proto"]
description = "Format proto files with buf"
run = "buf format -w"

[tasks."lint:proto"]
description = "Lint proto files with buf"
run = "buf lint"

[tasks."breaking:proto"]
description = "Check for breaking proto changes against base branch"
run = 'buf breaking s12 --against ".git#branch=origin/${GITHUB_BASE_REF},subdir=s12"'
